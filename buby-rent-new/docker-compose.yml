x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SECRET_KEY: ${SECRET_KEY}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@buby.it}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
  OPERATORE_PASSWORD: ${OPERATORE_PASSWORD:-operatore12345}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  MAIL_FROM: ${MAIL_FROM:-noreply@buby.it}
  INBOX_ADDRESS: ${INBOX_ADDRESS:-assistenza@buby.it}
  MAILPIT_URL: ${MAILPIT_URL:-http://mailpit:8025}
  POLL_SECONDS: ${POLL_SECONDS:-15}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # server SMTP finto con casella e interfaccia web (solo sviluppo e demo)
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"   # interfaccia web e API
      - "1025:1025"   # SMTP

  api:
    build: ./api
    environment: *api-env
    volumes:
      - ./api/app:/code/app
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    # spedisce le email in coda e legge la casella di assistenza
    build: ./api
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - ./api/app:/code/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
